[project]
name = "zettelkasten-mcp"
version = "0.1.0"
description = "MCP server for semantic search over markdown vaults with YAML frontmatter. Local RAG pipeline using Ollama + ChromaDB."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Falko Sieverding"}]
requires-python = ">=3.12"
keywords = ["mcp", "zettelkasten", "rag", "ollama", "chromadb", "markdown", "obsidian", "fastmcp", "llm", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastmcp>=2.0.0",
    "typer>=0.12.0",
    "ollama>=0.4.0",
    "chromadb>=0.5.0",
    "python-frontmatter>=1.1.0",
    "markdown-it-py>=3.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.28.0",
]

[project.urls]
Homepage = "https://gitlab.com/universalamateur1/zettelkasten-mcp"
Repository = "https://gitlab.com/universalamateur1/zettelkasten-mcp"
Changelog = "https://gitlab.com/universalamateur1/zettelkasten-mcp/-/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://gitlab.com/universalamateur1/zettelkasten-mcp/-/issues"

[project.scripts]
zettelkasten-mcp = "zettelkasten_mcp.cli:app"

[tool.poetry]
name = "zettelkasten-mcp"
version = "0.1.0"
description = "MCP server for semantic search over markdown vaults with YAML frontmatter. Local RAG pipeline using Ollama + ChromaDB."
authors = ["Falko Sieverding"]
license = "MIT"
readme = "README.md"
packages = [{include = "zettelkasten_mcp", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
fastmcp = "^2.0.0"
typer = "^0.12.0"
ollama = "^0.4.0"
chromadb = "^0.5.0"
python-frontmatter = "^1.1.0"
markdown-it-py = "^3.0.0"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
httpx = "^0.28.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pytest-cov = "^4.0.0"
pytest-asyncio = "^0.21.0"
black = "^23.0.0"
isort = "^5.12.0"
flake8 = "^6.0.0"
pylint = "^2.17.0"
mypy = "^1.0.0"
twine = "^5.0.0"

[tool.poetry.scripts]
zettelkasten-mcp = "zettelkasten_mcp.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
